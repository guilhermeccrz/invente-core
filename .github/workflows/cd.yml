name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1083775665503/locations/global/workloadIdentityPools/invente-github/providers/github
          service_account: inventa-cd@project-639ad7da-da3d-4115-970.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publica a imagem e sobe API e worker com minimo zero
        run: bash scripts/deploy.sh
        env:
          IMAGE_TAG: ${{ github.sha }}
